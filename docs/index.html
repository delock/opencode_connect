<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenCode Connect</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --text: #eee;
  --text-dim: #999;
  --success: #4caf50;
  --warn: #ff9800;
  --error: #f44336;
  --border: #333;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}
#config-panel {
  background: var(--surface);
  padding: 16px;
  border-bottom: 1px solid var(--border);
  max-height: 70vh;
  overflow-y: auto;
}
#config-panel.hidden { display: none; }
#config-panel h2 { margin-bottom: 12px; font-size: 16px; }
#config-panel h3 { margin: 16px 0 8px 0; font-size: 14px; color: var(--text-dim); }
.config-row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  align-items: center;
}
.config-row label {
  min-width: 160px;
  font-size: 13px;
  color: var(--text-dim);
}
.config-row input, .config-row select {
  flex: 1;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  font-size: 13px;
}
.config-row select {
  cursor: pointer;
}
.mode-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.mode-toggle label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  padding: 8px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 13px;
  transition: all 0.2s;
}
.mode-toggle input[type="radio"] { display: none; }
.mode-toggle input[type="radio"]:checked + span {
  color: var(--accent);
}
.mode-toggle label:has(input:checked) {
  border-color: var(--accent);
  background: var(--surface2);
}
.dev-warning {
  background: rgba(255, 152, 0, 0.1);
  border: 1px solid var(--warn);
  border-radius: 4px;
  padding: 8px 12px;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--warn);
}
.btn {
  padding: 6px 16px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: 0.9; }
.btn-secondary { background: var(--surface2); color: var(--text); }
.btn-secondary:hover { opacity: 0.9; }
.btn-small { padding: 4px 12px; font-size: 12px; }
.btn-success { background: var(--success); color: #fff; }
.btn-warn { background: var(--warn); color: #000; }
.btn-error { background: var(--error); color: #fff; }
#toolbar {
  background: var(--surface);
  padding: 8px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
#status-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
}
#status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--error);
}
#status-dot.connected { background: var(--success); }
#status-dot.polling { background: var(--warn); }
#status-mode {
  font-size: 11px;
  padding: 2px 6px;
  background: var(--bg);
  border-radius: 3px;
  margin-left: 8px;
}
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg-out {
  align-self: flex-end;
  background: var(--surface2);
}
.msg-in {
  align-self: flex-start;
  background: var(--surface);
  border: 1px solid var(--border);
}
.msg-status {
  align-self: center;
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  font-style: italic;
}
.msg-error {
  align-self: center;
  background: transparent;
  color: var(--error);
  font-size: 13px;
}
.msg-label {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.msg pre {
  background: var(--bg);
  padding: 8px;
  border-radius: 4px;
  overflow-x: auto;
  margin-top: 6px;
  font-size: 13px;
}
.msg-actions {
  margin-top: 8px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
#input-area {
  background: var(--surface);
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
#msg-input {
  flex: 1;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  min-height: 40px;
  max-height: 120px;
}
#msg-input:focus { outline: none; border-color: var(--accent); }
#send-btn {
  align-self: flex-end;
}
.cognito-fields, .dev-fields {
  display: none;
}
.cognito-fields.show, .dev-fields.show {
  display: block;
}
@media (max-width: 600px) {
  .config-row { flex-direction: column; align-items: stretch; }
  .config-row label { min-width: auto; margin-bottom: 4px; }
  .msg { max-width: 95%; }
}
</style>
</head>
<body>

<!-- Config Panel -->
<div id="config-panel">
  <h2>OpenCode Connect - Configuration</h2>
  
  <!-- Mode Toggle -->
  <div class="mode-toggle">
    <label>
      <input type="radio" name="auth-mode" value="dev" checked id="mode-dev">
      <span>Dev Mode (Access Key)</span>
    </label>
    <label>
      <input type="radio" name="auth-mode" value="cognito" id="mode-cognito">
      <span>Cognito Mode</span>
    </label>
  </div>
  
  <!-- Dev Mode Warning -->
  <div class="dev-fields show" id="dev-warning">
    <div class="dev-warning">
      <strong>Dev Mode:</strong> Credentials are stored in browser localStorage. 
      Only use for local testing. For production, use Cognito mode.
    </div>
  </div>
  
  <!-- Dev Mode Fields -->
  <div class="dev-fields show" id="dev-fields">
    <div class="config-row">
      <label>Access Key ID</label>
      <input id="cfg-access-key" type="password" placeholder="AKIA..." autocomplete="off" />
    </div>
    <div class="config-row">
      <label>Secret Access Key</label>
      <input id="cfg-secret-key" type="password" placeholder="Secret..." autocomplete="off" />
    </div>
  </div>
  
  <!-- Cognito Mode Fields -->
  <div class="cognito-fields" id="cognito-fields">
    <div class="config-row">
      <label>Cognito Identity Pool ID</label>
      <input id="cfg-cognito" placeholder="us-east-1:xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
    </div>
  </div>
  
  <!-- Common Fields -->
  <h3>SQS Queues</h3>
  <div class="config-row">
    <label>AWS Region</label>
    <input id="cfg-region" placeholder="us-east-1" />
  </div>
  <div class="config-row">
    <label>Queue (to web)</label>
    <input id="cfg-queue-to-web" placeholder="https://sqs.us-east-1.amazonaws.com/123456/opencode-to-web" />
  </div>
  <div class="config-row">
    <label>Queue (from web)</label>
    <input id="cfg-queue-from-web" placeholder="https://sqs.us-east-1.amazonaws.com/123456/web-to-opencode" />
  </div>
  <div class="config-row" style="justify-content: flex-end; margin-top: 12px;">
    <button id="btn-save-config" class="btn btn-primary">Save & Connect</button>
  </div>
</div>

<!-- Toolbar -->
<div id="toolbar">
  <div id="status-indicator">
    <div id="status-dot"></div>
    <span id="status-text">Disconnected</span>
    <span id="status-mode"></span>
  </div>
  <div>
    <button id="btn-config" class="btn btn-secondary btn-small">Config</button>
    <button id="btn-clear" class="btn btn-secondary btn-small">Clear</button>
  </div>
</div>

<!-- Messages -->
<div id="messages"></div>

<!-- Input -->
<div id="input-area">
  <textarea id="msg-input" placeholder="Type a message or !command..." rows="1"></textarea>
  <button id="btn-send" class="btn btn-primary">Send</button>
</div>

<script type="module">
// ============================================================
// AWS SDK - use skypack CDN
// ============================================================
import { SQSClient, SendMessageCommand, ReceiveMessageCommand, DeleteMessageCommand } from 'https://cdn.skypack.dev/@aws-sdk/client-sqs@3.620.0?min';

// ============================================================
// State
// ============================================================
let sqsClient = null;
let queueToWeb = '';
let queueFromWeb = '';
let polling = false;
let pollAbort = null;
let currentMode = 'dev';

// ============================================================
// Config
// ============================================================
function loadConfig() {
  const saved = localStorage.getItem('opencode_connect_config');
  if (!saved) return null;
  try { return JSON.parse(saved); } catch { return null; }
}

function getAuthMode() {
  const radios = document.getElementsByName('auth-mode');
  for (const r of radios) {
    if (r.checked) return r.value;
  }
  return 'dev';
}

function toggleAuthMode() {
  const mode = getAuthMode();
  currentMode = mode;
  
  const devFields = document.getElementById('dev-fields');
  const devWarning = document.getElementById('dev-warning');
  const cognitoFields = document.getElementById('cognito-fields');
  
  if (mode === 'dev') {
    devFields.classList.add('show');
    devWarning.classList.add('show');
    cognitoFields.classList.remove('show');
  } else {
    devFields.classList.remove('show');
    devWarning.classList.remove('show');
    cognitoFields.classList.add('show');
  }
}

function saveConfig() {
  const mode = getAuthMode();
  const config = {
    mode,
    region: document.getElementById('cfg-region').value.trim(),
    queueToWeb: document.getElementById('cfg-queue-to-web').value.trim(),
    queueFromWeb: document.getElementById('cfg-queue-from-web').value.trim(),
  };

  if (mode === 'dev') {
    config.accessKey = document.getElementById('cfg-access-key').value.trim();
    config.secretKey = document.getElementById('cfg-secret-key').value.trim();
    
    if (!config.accessKey || !config.secretKey) {
      alert('Access Key ID and Secret Access Key are required in Dev Mode.');
      return;
    }
  } else {
    config.cognitoPoolId = document.getElementById('cfg-cognito').value.trim();
    
    if (!config.cognitoPoolId) {
      alert('Cognito Identity Pool ID is required in Cognito Mode.');
      return;
    }
  }

  if (!config.region || !config.queueToWeb || !config.queueFromWeb) {
    alert('Region and Queue URLs are required.');
    return;
  }

  localStorage.setItem('opencode_connect_config', JSON.stringify(config));
  document.getElementById('config-panel').classList.add('hidden');
  connect(config);
}

function populateConfigForm(config) {
  if (!config) return;
  
  // Set mode
  const mode = config.mode || 'dev';
  const radios = document.getElementsByName('auth-mode');
  for (const r of radios) {
    r.checked = r.value === mode;
  }
  toggleAuthMode();
  
  document.getElementById('cfg-region').value = config.region || '';
  document.getElementById('cfg-queue-to-web').value = config.queueToWeb || '';
  document.getElementById('cfg-queue-from-web').value = config.queueFromWeb || '';
  
  if (mode === 'dev') {
    document.getElementById('cfg-access-key').value = config.accessKey || '';
    document.getElementById('cfg-secret-key').value = config.secretKey || '';
  } else {
    document.getElementById('cfg-cognito').value = config.cognitoPoolId || '';
  }
}

function toggleConfig() {
  const panel = document.getElementById('config-panel');
  panel.classList.toggle('hidden');
}

// ============================================================
// SQS connection
// ============================================================
function connect(config) {
  // Stop existing polling
  if (pollAbort) {
    pollAbort.abort();
    pollAbort = null;
  }
  polling = false;

  try {
    // Store credentials for async provider
    const creds = {
      accessKeyId: config.accessKey,
      secretAccessKey: config.secretKey,
    };
    
    sqsClient = new SQSClient({
      region: config.region,
      credentials: async () => creds,
    });

    queueToWeb = config.queueToWeb;
    queueFromWeb = config.queueFromWeb;

    document.getElementById('status-mode').textContent = 'Dev Mode';
    setStatus('polling', 'Connecting...');
    startPolling();
  } catch (err) {
    setStatus('error', 'Connection failed');
    addMessage('error', `Connection error: ${err.message}`);
    document.getElementById('config-panel').classList.remove('hidden');
  }
}

// ============================================================
// Polling
// ============================================================
async function startPolling() {
  if (polling) return;
  polling = true;
  pollAbort = new AbortController();

  setStatus('polling', 'Polling...');

  while (polling && !pollAbort.signal.aborted) {
    try {
      const result = await sqsClient.send(new ReceiveMessageCommand({
        QueueUrl: queueToWeb,
        MaxNumberOfMessages: 10,
        WaitTimeSeconds: 20,
      }));

      if (!polling) break;
      setStatus('connected', 'Connected');

      if (result.Messages) {
        for (const msg of result.Messages) {
          if (!msg.Body || !msg.ReceiptHandle) continue;
          try {
            const parsed = JSON.parse(msg.Body);
            handleIncoming(parsed);
          } catch {
            // skip invalid
          }
          // Delete after processing
          try {
            await sqsClient.send(new DeleteMessageCommand({
              QueueUrl: queueToWeb,
              ReceiptHandle: msg.ReceiptHandle,
            }));
          } catch {
            // deletion failed, will reappear
          }
        }
      }
    } catch (err) {
      if (pollAbort?.signal.aborted) break;
      setStatus('error', 'Poll error');
      addMessage('error', `Poll error: ${err.message}`);
      // Wait before retry
      await new Promise(r => setTimeout(r, 5000));
    }
  }
}

// ============================================================
// Send messages
// ============================================================
async function sendToSqs(msg) {
  if (!sqsClient) {
    addMessage('error', 'Not connected. Configure settings first.');
    return;
  }
  try {
    await sqsClient.send(new SendMessageCommand({
      QueueUrl: queueFromWeb,
      MessageBody: JSON.stringify(msg),
    }));
  } catch (err) {
    addMessage('error', `Send error: ${err.message}`);
  }
}

async function sendPrompt() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoResizeInput();

  // Determine message type
  if (text.startsWith('!') && text.length > 1) {
    addMessage('out', `! ${text.slice(1)}`);
    await sendToSqs({ type: 'shell', command: text.slice(1) });
  } else {
    addMessage('out', text);
    await sendToSqs({ type: 'prompt', text });
  }
}

async function sendPermissionReply(permissionId, response) {
  addMessage('out', `Permission: ${response}`);
  // Disable buttons in the permission message
  const btns = document.querySelectorAll(`[data-perm-id="${permissionId}"]`);
  btns.forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });
  await sendToSqs({ type: 'permission_reply', permissionId, response });
}

async function sendQuestionReply(requestId, answers) {
  const label = Array.isArray(answers[0]) ? answers[0][0] : answers;
  addMessage('out', `Answer: ${label}`);
  // Disable buttons
  const btns = document.querySelectorAll(`[data-q-id="${requestId}"]`);
  btns.forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });
  await sendToSqs({ type: 'question_reply', requestId, answers });
}

// ============================================================
// Handle incoming messages
// ============================================================
function handleIncoming(msg) {
  switch (msg.type) {
    case 'status':
      addMessage('status', `Instance ${msg.instanceId} connected from ${msg.hostname}:${msg.directory}`);
      break;

    case 'output':
      addMessage('in', msg.text || '(empty response)', 'OpenCode');
      break;

    case 'permission': {
      const div = document.createElement('div');
      div.className = 'msg msg-in';

      let html = `<div class="msg-label">Permission Request</div>`;
      html += `<strong>${escHtml(msg.permission || '')}</strong>\n`;
      if (msg.patterns && msg.patterns.length) {
        html += `Pattern: <code>${escHtml(msg.patterns.join(', '))}</code>\n`;
      }
      if (msg.toolName) html += `Tool: <code>${escHtml(msg.toolName)}</code>\n`;
      if (msg.toolArgs) html += `Args: <code>${escHtml(truncate(msg.toolArgs, 200))}</code>\n`;
      html += `<div class="msg-actions">`;
      html += `<button class="btn btn-small btn-success perm-btn" data-perm-id="${escAttr(msg.permissionId)}" data-response="once">Allow Once</button>`;
      html += `<button class="btn btn-small btn-warn perm-btn" data-perm-id="${escAttr(msg.permissionId)}" data-response="always">Always Allow</button>`;
      html += `<button class="btn btn-small btn-error perm-btn" data-perm-id="${escAttr(msg.permissionId)}" data-response="reject">Reject</button>`;
      html += `</div>`;

      div.innerHTML = html;
      appendToMessages(div);
      break;
    }

    case 'question': {
      const div = document.createElement('div');
      div.className = 'msg msg-in';

      let html = `<div class="msg-label">Question</div>`;
      if (msg.header) html += `<strong>${escHtml(msg.header)}</strong>\n`;
      html += `${escHtml(msg.question || '')}\n`;

      html += `<div class="msg-actions">`;
      const options = msg.options || [];
      for (let i = 0; i < options.length; i++) {
        const opt = options[i];
        const label = opt.label + (opt.description ? ` - ${opt.description}` : '');
        html += `<button class="btn btn-small btn-secondary q-btn" data-q-id="${escAttr(msg.requestId)}" data-answer="${escAttr(opt.label)}">${i + 1}. ${escHtml(label)}</button>`;
      }
      html += `</div>`;

      if (msg.custom) {
        html += `<div style="margin-top:8px;display:flex;gap:6px;">`;
        html += `<input type="text" class="q-custom-input" data-q-id="${escAttr(msg.requestId)}" placeholder="Custom answer..." style="flex:1;padding:4px 8px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:13px;" />`;
        html += `<button class="btn btn-small btn-primary q-custom-btn" data-q-id="${escAttr(msg.requestId)}">Send</button>`;
        html += `</div>`;
      }

      div.innerHTML = html;
      appendToMessages(div);
      break;
    }

    case 'shell_output': {
      let text = `$ ${msg.command}\n`;
      text += msg.output || '(no output)';
      if (msg.exitCode !== 0) text += `\n(exit code: ${msg.exitCode})`;
      addMessageWithPre('in', text, 'Shell');
      break;
    }

    case 'error':
      addMessage('error', msg.message || 'Unknown error');
      break;

    default:
      addMessage('status', `Unknown message type: ${msg.type}`);
  }
}

// ============================================================
// UI helpers
// ============================================================
function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  const label = document.getElementById('status-text');
  dot.className = state === 'connected' ? 'connected' : state === 'polling' ? 'polling' : '';
  label.textContent = text;
}

function addMessage(type, text, label) {
  const div = document.createElement('div');
  if (type === 'out') {
    div.className = 'msg msg-out';
    div.textContent = text;
  } else if (type === 'in') {
    div.className = 'msg msg-in';
    if (label) {
      const lbl = document.createElement('div');
      lbl.className = 'msg-label';
      lbl.textContent = label;
      div.appendChild(lbl);
    }
    div.appendChild(document.createTextNode(text));
  } else if (type === 'status') {
    div.className = 'msg msg-status';
    div.textContent = text;
  } else if (type === 'error') {
    div.className = 'msg msg-error';
    div.textContent = text;
  }
  appendToMessages(div);
}

function addMessageWithPre(type, text, label) {
  const div = document.createElement('div');
  div.className = 'msg msg-in';
  if (label) {
    const lbl = document.createElement('div');
    lbl.className = 'msg-label';
    lbl.textContent = label;
    div.appendChild(lbl);
  }
  const pre = document.createElement('pre');
  pre.textContent = text;
  div.appendChild(pre);
  appendToMessages(div);
}

function appendToMessages(el) {
  const container = document.getElementById('messages');
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function clearMessages() {
  document.getElementById('messages').innerHTML = '';
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function truncate(s, max) {
  return s && s.length > max ? s.slice(0, max) + '...' : s;
}

// ============================================================
// Input handling
// ============================================================
const input = document.getElementById('msg-input');

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendPrompt();
  }
});

input.addEventListener('input', autoResizeInput);

function autoResizeInput() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}

// ============================================================
// Init
// ============================================================
document.getElementById('btn-save-config').addEventListener('click', saveConfig);
document.getElementById('btn-config').addEventListener('click', toggleConfig);
document.getElementById('btn-clear').addEventListener('click', clearMessages);
document.getElementById('btn-send').addEventListener('click', sendPrompt);
document.getElementById('mode-dev').addEventListener('change', toggleAuthMode);
document.getElementById('mode-cognito').addEventListener('change', toggleAuthMode);

// Event delegation for dynamically created buttons
document.getElementById('messages').addEventListener('click', async (e) => {
  const target = e.target;
  
  // Permission buttons
  if (target.classList.contains('perm-btn')) {
    const permId = target.dataset.permId;
    const response = target.dataset.response;
    await sendPermissionReply(permId, response);
    return;
  }
  
  // Question option buttons
  if (target.classList.contains('q-btn')) {
    const qId = target.dataset.qId;
    const answer = target.dataset.answer;
    await sendQuestionReply(qId, [[answer]]);
    return;
  }
  
  // Question custom send button
  if (target.classList.contains('q-custom-btn')) {
    const qId = target.dataset.qId;
    const input = document.querySelector(`.q-custom-input[data-q-id="${qId}"]`);
    if (input && input.value.trim()) {
      await sendQuestionReply(qId, [[input.value.trim()]]);
    }
    return;
  }
});

const savedConfig = loadConfig();
if (savedConfig) {
  populateConfigForm(savedConfig);
  document.getElementById('config-panel').classList.add('hidden');
  connect(savedConfig);
} else {
  // Show config panel with dev mode as default
  toggleAuthMode();
